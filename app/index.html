<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Studio</title>
<link rel="icon" href="./favicon.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <h1>Vice City Cover Studio</h1>
  <p>Your photo, five panels, one Vice City sunset. Export a GTA-style cover in three post sizes.</p>
</header>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <div class="group">
      <h2>Layout</h2>
      <div id="layouts" class="picker"></div>
    </div>
    <div class="group">
      <h2>Size</h2>
      <div id="sizes" class="picker"></div>
    </div>
    <div class="group">
      <h2>Grade</h2>
      <div id="grades" class="picker"></div>
    </div>
    <div class="group">
      <h2>Caption</h2>
      <label>Title <input id="title" type="text" maxlength="40" value="Vice City"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="60" value="sunset drive"></label>
    </div>
    <div class="group">
      <h2>Effects</h2>
      <label class="check"><input id="fx-halftone" type="checkbox" checked> Halftone print</label>
      <label class="check"><input id="fx-grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="fx-vignette" type="checkbox" checked> Vignette</label>
    </div>
    <div class="group">
      <h2>Panels</h2>
      <p class="hint">Click a panel on the cover to select it, drag it to pan, scroll over it to zoom — or drop a photo into its row below.</p>
      <div id="panels"></div>
      <button id="fill-all" type="button">Fill all panels</button>
    </div>
    <div class="group">
      <h2>Export PNG</h2>
      <div class="exports">
        <button id="export-square" type="button">1080 × 1080</button>
        <button id="export-portrait" type="button">1080 × 1350</button>
        <button id="export-wide" type="button">1920 × 1080</button>
        <button id="export-all" type="button" class="primary">Export all 3</button>
      </div>
      <p id="status" role="status"></p>
    </div>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="720" height="720" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
